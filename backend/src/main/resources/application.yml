server:
  port: 8080

spring:
  application:
    name: lan-recruitment-backend
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
  autoconfigure:
    exclude:
      - cn.dev33.satoken.dao.SaTokenDaoRedisJackson
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    active: dev
  redis:
    host: localhost
    port: 6379
    password: ${APP_REDIS_PASSWORD:}
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-write-header: false

lan:
  sa-token:
    store: memory
  match:
    cache:
      store: memory
  email:
    host:
    from:
    password:
    username:
  storage:
    base-dir: ${user.home}/lan-recruitment/uploads
    avatar: ${lan.storage.base-dir}/avatar
    resume: ${lan.storage.base-dir}/resume
