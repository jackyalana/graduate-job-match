server:
  port: 8080

spring:
  application:
    name: lan-recruitment-backend
  datasource:
    url: jdbc:mysql://localhost:3306/lan_recruitment?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
  autoconfigure:
    exclude:
      - cn.dev33.satoken.dao.SaTokenDaoRedisJackson
  profiles:
    active: dev
  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid

lan:
  sa-token:
    store: memory
  match:
    cache:
      store: memory
  email:
    host:
    from:
    password:
    username:
  storage:
    base-dir: ${user.home}/lan-recruitment/uploads
    avatar: ${lan.storage.base-dir}/avatar
    resume: ${lan.storage.base-dir}/resume
